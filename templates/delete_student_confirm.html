{% extends "base.html" %}
{% block content %}
<div class="container py-5 d-flex justify-content-center">
  <div class="card shadow-lg border-0 text-center delete-card">
    <div class="card-body p-4 p-lg-5">
      <p class="text-uppercase text-danger small mb-2">Admin only</p>
      <h2 class="fw-bold mb-3">Delete Student Record</h2>
      <p class="text-muted mb-4">
        Are you sure you want to delete <strong>{{ student.name }}</strong>
        with student number <strong>{{ student.student_no }}</strong>?
      </p>

      <form method="post" class="d-flex flex-column gap-2">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete Student</button>
        <a href="{% url 'edit_student' student.pk %}" class="btn btn-outline-secondary">Go Back</a>
      </form>
    </div>
  </div>
</div>

<style>
.delete-card {
    max-width: 520px;
    width: 100%;
    border-radius: 24px;
}
</style>
{% endblock %}
